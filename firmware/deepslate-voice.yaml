# ============================================================================
# Per-device stub for the Deepslate Voice PE (thin-client firmware).
#
# Pulls the proven thin-client firmware (wake word + XMOS cleanup on-device,
# PCM-over-WebSocket to a backend) as a remote package and points it at the
# Deepslate Voice Bridge add-on via `va_url`.
#
# Usage (from repo root):
#   1. cp firmware/secrets.yaml.example firmware/secrets.yaml   # fill in Wi-Fi
#   2. Dev (bridge running on your machine):
#        uvx esphome run firmware/deepslate-voice.yaml --device /dev/cu.usbmodem212201
#      with va_url below set to ws://<your-machine-LAN-IP>:8080/
#   3. Prod: set va_url to ws://homeassistant.local:8080/ and re-run.
# ============================================================================
substitutions:
  name: deepslate-voice
  friendly_name: Deepslate Voice
  wifi_ssid: !secret wifi_ssid
  wifi_password: !secret wifi_password
  ota_password: !secret ota_password
  api_key: !secret api_key
  # WebSocket endpoint of the Deepslate Voice Bridge.
  #   dev : ws://<laptop-LAN-IP>:8080/
  #   prod: ws://homeassistant.local:8080/
  # DEV: bridge running on the Mac. Switch to ws://homeassistant.local:8080/
  # for the add-on deployment and re-flash (or OTA-update) once.
  va_url: ws://192.168.178.167:8080/

# The thin-client firmware yaml is VENDORED into this repo (firmware/
# thin-client.yaml) instead of pulled remotely: the upstream fork is a
# personal variant (alexa-only wake word, dead model URL) — our copy pins a
# known-good config with the stock "Okay Nabu" wake word. The va_client C++
# component is still pulled from the fork's git (see external_components in
# thin-client.yaml).
packages:
  realtime: !include thin-client.yaml
