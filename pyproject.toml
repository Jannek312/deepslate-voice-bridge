[project]
name = "deepslate-voice-bridge"
version = "0.1.0"
description = "Bridge between Home Assistant Voice PE thin-client firmware and Deepslate Realtime (Opal S2S)"
requires-python = ">=3.12"
dependencies = [
    "websockets>=13.0",
    "aiohttp>=3.10",
    "protobuf>=5.27",
    "deepslate-core>=0.1.15",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "grpcio-tools>=1.66",
    "pytest-aiohttp>=1.1.1",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["deepslate_voice_bridge/tests"]
pythonpath = ["deepslate_voice_bridge"]
asyncio_default_fixture_loop_scope = "function"

[tool.uv]
package = false
